name: 🧪 CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build release APK and create pre-release'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 📊 Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get

      - name: 📊 Dart analysis
        run: flutter analyze --no-fatal-infos

  test:
    name: ✅ Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: ✅ Run tests
        run: flutter test --coverage

      - name: 📤 Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get

      - name: 🔐 Generate Android signing files
        if: ${{ inputs.build_release == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: 🏗️ Build release APK
        if: ${{ inputs.build_release == 'true' }}
        run: flutter build apk --release --split-per-abi

      - name: 🏗️ Build debug APK
        if: ${{ inputs.build_release != 'true' }}
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk

  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get

      - name: 🏗️ Build web
        run: flutter build web

      - name: 📦 Package web build (for release)
        if: ${{ inputs.build_release == 'true' }}
        run: |
          cd build/web
          tar -czf ../../flycode-web.tar.gz .
          cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  prerelease:
    name: 🏷️ Create Pre-release
    runs-on: ubuntu-latest
    needs: [build-android, build-web]
    if: ${{ inputs.build_release == 'true' }}
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: release-artifacts/

      - name: 📥 Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-staging/

      - name: 📦 Package web build
        run: |
          cd web-staging
          tar -czf ../release-artifacts/flycode-web.tar.gz .
          cd ..

      - name: 📋 List release artifacts
        run: ls -lh release-artifacts/

      - name: 🏷️ Create Pre-release
        uses: ncipollo/release-action@v1.16.0
        with:
          tag: ci-${{ github.ref_name }}-${{ github.run_number }}
          name: "CI Build #${{ github.run_number }} (${{ github.ref_name }})"
          artifacts: release-artifacts/*
          prerelease: true
          body: |
            Automated pre-release build from CI.

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          token: ${{ secrets.GITHUB_TOKEN }}
