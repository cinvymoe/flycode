name: 🛠 Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.1). Used as release tag and for changelog extraction.'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Cache pub deps
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: ✅ Run tests
        run: flutter test --coverage

      - name: 🔐 Generate Android signing files
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: 🏗️ Build APKs
        run: flutter build apk --release --split-per-abi

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/

      - name: 📤 Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/
          retention-days: 1

  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Cache pub deps
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: 🏗️ Build web
        run: flutter build web

      - name: 📦 Package web build
        run: |
          cd build/web
          tar -czf ../../flycode-web.tar.gz .
          cd ../..

      - name: 📤 Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: flycode-web.tar.gz
          retention-days: 1

  release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-web]
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🔖 Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/

      - name: 📥 Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: release-artifacts/

      - name: 📋 List release artifacts
        run: ls -lh release-artifacts/

      - name: 📝 Extract release notes from CHANGELOG
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "([[:space:]]-|$)" { found = 1 }
            found && $0 ~ "^## v[0-9]" && $0 !~ "^## " tag "([[:space:]]-|$)" { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::warning::No changelog entry found for ${TAG} in CHANGELOG.md, using default release notes"
            echo "Release ${TAG}" > release_notes.md
          fi

      - name: 🏷️ Create or update Release
        uses: ncipollo/release-action@v1.16.0
        with:
          tag: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          artifacts: release-artifacts/*
          bodyFile: release_notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
